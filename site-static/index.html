<h1>MTG card fingerprints</h1>
<p>Small numeric fingerprints of Magic: The Gathering card illustrations, as static files (<code>fp/index.json</code> and <code>fp/s&lt;n&gt;.bin.gz</code>), used to recognise a card from a photo.
Not meant to be browsed: <a href="https://github.com/Louis1190/mtg-card-fingerprints">the repository</a> describes the format.</p>
